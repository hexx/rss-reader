name = "rss-reader"
main = "src/worker.ts"
# 複数 Cloudflare アカウントを扱う運用下で `wrangler d1 migrations apply` /
# `wrangler deploy` などが意図しないアカウントを引いてしまうのを防ぐため、
# 使用するアカウントを明示する。値は `wrangler whoami` で確認できる 32 桁
# 16 進の Account ID に置き換えること。未設定だと wrangler のデフォルト
# 認証アカウントが使われ、エラー 7403 (The given account is not valid...)
# になることがある。
account_id = "ACCOUNT_ID_PLACEHOLDER"
# 2024-09-23 以降にすると nodejs_compat が v2 として扱われ、node: プレフィックスなしで
# Node.js ビルトイン（http/url/events/timers 等）を利用できる。rss-parser / xml2js が
# プレフィックスなしでビルトインを require するため、これ未満だとビルドが失敗する。
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

assets = { directory = "./dist-client", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "rss-reader"
database_id = "DATABASE_ID_PLACEHOLDER"
# Drizzle が生成するマイグレーションは `drizzle/` 配下に置かれる
# (デフォルトの `migrations/` ではない) ため、wrangler に場所を教える
migrations_dir = "drizzle"

[triggers]
# 同期は2つのカデンサで動かす（詳細は docs/adr/0002-split-sync-cadences.md）:
#   "15,45 * * * *"  新着記事の取り込み専用（既存記事のはてブ再取得はしない）
#   "0 */3 * * *"   フル同期（新着取り込み＋全フィード記事のはてブバックフィル）
# 分 0 で両 cron が衝突して scheduled ハンドラが二重起動しないよう、
# 取り込み側は :15 / :45 にずらしている。
# scheduled ハンドラ側で event.cron を見て、どちらの同期かを判定する。
crons = ["15,45 * * * *", "0 */3 * * *"]

# AI プロバイダ（OpenAI 互換エンドポイント）の設定
# 秘匿値である API キーは wrangler.toml には書き込まず、以下で設定する：
#   npx wrangler secret put AI_API_KEY
# 公開値（ベース URL・モデル名）は [vars] に記載する。
[vars]
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
